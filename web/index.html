<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="olivia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>olivia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="vibrationState" style="font-size:1.2rem; margin:10px; color:#333;">Vibration State: <span id="vibState">-</span></div>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDwY5wWSwBLXecbdkKcdSrORyLG2jrSgS4",
      authDomain: "eldn-olivia-dash.firebaseapp.com",
      databaseURL: "https://eldn-olivia-dash-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "eldn-olivia-dash",
      storageBucket: "eldn-olivia-dash.firebasestorage.app",
      messagingSenderId: "668816548295",
      appId: "1:668816548295:web:66eb9449492e9a89a739e2"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const vibRef = db.ref('/eldn/device_status/vibrationState');
    vibRef.on('value', (snap) => {
      const state = snap.val() || 'UNKNOWN';
      document.getElementById('vibState').textContent = state;
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
